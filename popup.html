<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udemy & YouTube TTS</title>
    <style>
        body {
            width: 320px;
            padding: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
        }
        
        h2 {
            margin: 0 0 16px 0;
            font-size: 20px;
            text-align: center;
        }
        
        .control-group {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        select {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            background: white;
            color: #333;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        select:focus {
            outline: 2px solid #ffd700;
        }
        
        #status {
            text-align: center;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 12px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
        }
        
        #status.active {
            background: rgba(16, 185, 129, 0.3);
        }
        
        #status.inactive {
            background: rgba(239, 68, 68, 0.3);
        }
        
        .tts-toggle-label {
            display: block;
            cursor: pointer;
            user-select: none;
        }
        
        .tts-checkbox {
            display: none;
        }
        
        .tts-toggle-text {
            display: inline-block;
            padding: 14px 28px;
            background: #10b981;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        .tts-toggle-text:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        
        .tts-checkbox:checked + .tts-toggle-text {
            background: #ef4444;
        }
        
        .tts-checkbox:checked + .tts-toggle-text:hover {
            background: #dc2626;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }
        
        .toggle-on {
            display: none;
        }
        
        .tts-checkbox:checked ~ .tts-toggle-text .toggle-off {
            display: none;
        }
        
        .tts-checkbox:checked ~ .tts-toggle-text .toggle-on {
            display: inline;
        }
        
        .tts-checkbox + .tts-toggle-text .toggle-on {
            display: none;
        }
        
        .tts-checkbox + .tts-toggle-text .toggle-off {
            display: inline;
        }
        
        .tts-checkbox:checked + .tts-toggle-text .toggle-off {
            display: none;
        }
        
        .tts-checkbox:checked + .tts-toggle-text .toggle-on {
            display: inline;
        }
        
        .speed-control {
            margin-top: 10px;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 8px 0;
        }
        
        .speed-value {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
        
        .video-status {
            text-align: center;
            font-size: 11px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        
        .tip {
            text-align: center;
            margin-top: 12px;
            font-size: 11px;
            opacity: 0.7;
            line-height: 1.4;
        }
        
        input[type="checkbox"] {
            width: auto;
            margin: 0;
            cursor: pointer;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            text-transform: none;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <h2>🎤 Udemy TTS</h2>
    
    <div id="status" class="inactive">⏹️ Stopped</div>
    <div class="video-status">
        🎬 Video: <span id="video-state">Unknown</span>
    </div>
    
    <div class="control-group" style="text-align: center;">
        <label class="tts-toggle-label">
            <input type="checkbox" id="tts-toggle" class="tts-checkbox">
            <span class="tts-toggle-text">
                <span class="toggle-off">▶️ Start TTS</span>
                <span class="toggle-on">⏹️ Stop TTS</span>
            </span>
        </label>
    </div>
    
    <div class="control-group">
        <label for="voice-select">🗣️ Select Voice</label>
        <select id="voice-select">
            <option value="">Loading voices...</option>
        </select>
        
        <div class="speed-control">
            <label for="speed-range">⚡ Speed</label>
            <input type="range" id="speed-range" min="0.5" max="3.0" step="0.1" value="1.5">
            <div class="speed-value"><span id="speed-value">1.5</span>x</div>
        </div>
        
        <div class="speed-control">
            <label for="volume-range">🔊 Volume</label>
            <input type="range" id="volume-range" min="0.1" max="1.0" step="0.1" value="1.0">
            <div class="speed-value"><span id="volume-value">1.0</span></div>
        </div>
    </div>
    
    <div class="control-group">
        <label>🎭 Natural Speech</label>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
            <label class="checkbox-label">
                <input type="checkbox" id="auto-translate" checked>
                🌐 Auto-translate English to Spanish
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="natural-pauses" checked>
                Natural Pauses (. , ; :)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="emotional-tone" checked>
                Emotional Tone (! ?)
            </label>
        </div>
    </div>
    
    <div class="tip">
        💡 TTS pauses automatically when you pause the video
    </div>

    <script src="popup.js"></script>
</body>
</html>
